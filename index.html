<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitopus | Healthy Meals, Delivered Daily</title>

    <!-- Open the font/image connections early so they don't queue behind the CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />

    <!-- Text faces. Declared here (not @import-ed from CSS) so the browser can
         start fetching them immediately instead of after the stylesheet parses.
         Inter is served as a single variable file; Poppins only ships the
         weights the UI actually uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Poppins:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols, subset to only the icons this app renders. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=arrow_back,arrow_forward,breakfast_dining,check,dinner_dining,groups,local_shipping,lunch_dining,qr_code_2,restaurant,share,star,support_agent,timer,verified&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
